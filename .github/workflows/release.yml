name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check tag and architecture
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "$TAG" = "v$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          test "$(uname -m)" = "$ARCH"
      - run: python3 scripts/check-localizations.py
      - run: ./scripts/test.sh
      - run: ./scripts/build.sh
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: AeroTab-${{ matrix.arch }}
          path: build/AeroTab-*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: AeroTab-*
          merge-multiple: true
          path: artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        working-directory: artifacts
        run: |
          sha256sum AeroTab-*.zip > SHA256SUMS.txt
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Install / 安装

          Requires macOS 26+ and AeroSpace 0.21.3-Beta or later.

          - **Apple Silicon / Apple 芯片:** download the `arm64.zip`.
          - **Intel:** download the `x86_64.zip`.

          Unzip, drag AeroTab.app into Applications, and follow the setup guide.
          解压后将 AeroTab.app 拖入应用程序，按引导完成授权，即可使用 ⌥Tab。

          Builds are ad-hoc signed and not notarized. / 安装包使用 ad-hoc 签名，尚未公证。
          NOTES
          gh release create "$TAG" AeroTab-*.zip SHA256SUMS.txt \
            --verify-tag --draft --title "AeroTab $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
